problem: "During my Stetson Health Services internship, clinic reporting depended on raw multi-year Excel exports. The years did not share a schema: dates, diagnosis fields and demographic headers all changed."
built: "I worked with clinic staff to define what privacy-conscious reporting should show. I then built a pandas pipeline that normalizes every export into one model, plus a self-contained dashboard. Clinic staff used it to review data that had only been available as raw spreadsheet exports. The public repository rebuilds the whole thing from deterministic synthetic inputs."
summary: "I built a pipeline that reconciles each year’s export into one model and publishes only aggregated, de-identified counts. Clinic staff used the dashboard to review data that had only existed as raw spreadsheets."
limits: "The dashboard is descriptive. It does not establish prevalence, causes or staffing needs. Records include canceled and no-show bookings from 2023 onward. Earlier exports have no status field, so those years cannot be split into kept and missed appointments."
flow:
  - "Excel exports (synthetic in public)"
  - "Normalize, drop PII fields"
  - "Aggregate, suppress counts under 5"
  - "Privacy and schema checks"
  - "Standalone HTML"
decisions:
  - title: "One canonical model"
    body: "The pipeline handles mixed date formats, diagnosis codes vs. free text, and “Gender Identity” vs. “Gender” headers explicitly, rather than assuming every year has the same columns."
  - title: "Suppression you cannot reverse"
    body: "Cells under five are published as zero, so a reader cannot tell a true zero from a suppressed small count. As a result, displayed subtotals may not add up to the overall total."
evidence:
  - "Clinic staff used the internal dashboard to review data that previously existed only as raw exports."
  - "Tests fail the build if the privacy threshold or output contract regresses."
  - "CI rebuilds the synthetic data and dashboard and checks the published page is byte-for-byte reproducible. The Pages artifact contains only the generated page and its font license."
boundary:
  - title: "Clinic work"
    body: "Built on institution exports in a controlled local workspace. Nothing from it is public."
  - title: "Public demo"
    body: "Every number is generated by a seeded synthetic model of a generic academic calendar."
headline: "Make years of clinic records easier to understand."
blurb: "Reconciles inconsistent exports into readable reporting. The public demo uses synthetic data."
featuredDecision: 0
