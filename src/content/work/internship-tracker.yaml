problem: "Internship postings are scattered across company career boards. Keeping a spreadsheet in step with an inbox full of receipts, assessments and rejections is slow and error-prone."
built: "I designed and built the whole system, and I use it for my own search. A scheduled GitHub Actions job polls Greenhouse, Lever, Ashby, company pages and the Simplify list, then scores every posting against a profile with written reasons. On my Mac, a local agent sends notifications, a Flask dashboard replaces the spreadsheet, and a 15-minute Apple Mail sync moves each application to its new stage."
summary: "A scheduled cloud job finds and scores postings with written reasons. On my Mac, a local dashboard and mail sync track each application through its stages."
limits: "Mail coverage is limited to the Inbox, Archive and job-named folders. JSON interchange works at hundreds of rows but would be the first thing to replace at scale. Status precedence is hard-coded."
flow:
  - "Public job boards"
  - "Actions poller: dedupe, score"
  - "JSON review queue"
  - "Mac agent + mail sync"
  - "Local dashboard"
decisions:
  - title: "Place work by privilege"
    body: "Credential-free polling runs on short-lived cloud runners. Anything that needs mailbox or notification permissions stays on my machine. The two halves only exchange JSON files, so neither can break the other’s schedule."
  - title: "Explainable scoring over ML"
    body: "Scores come from a deterministic rule engine, so every score and every rejection carries a stated reason I can audit."
  - title: "Merge order must not matter"
    body: "Apple Mail’s locale-formatted dates once sorted “Thursday” after “Tuesday” and let older statuses overwrite newer ones. Every event is now normalized to an ISO date, and the merge gives the same result in any order."
evidence:
  - "A 13-case fault-injection suite found four failures. All are fixed and kept as regression tests."
  - "Fixed a dedupe key that merged distinct requisitions with identical titles (about 19% of listings on one run)."
  - "Frontend tests compare all 128 demo record/status combinations against the Python merger."
boundary:
  - title: "Public demo"
    body: "A static site with fictional fixtures, scored by the real scorer. It never calls a mailbox or an API."
  - title: "Local tracker"
    body: "Runs on 127.0.0.1 against my real queue and mail metadata. Never published."
  - title: "Private config"
    body: "Profile, accounts and job history live in a separate private repository."
headline: "Find opportunities. Keep track of what happens next."
blurb: "Screens internship postings and brings application stages and email updates into one workflow."
featuredDecision: 1
