problem: "Portfolio risk numbers are easy to compute wrongly. Forward-filled gaps, adjusted prices mixed from different fetches, and silent rebalancing assumptions all produce figures that look confident but are wrong."
built: "I built a FastAPI service with pure pandas analytics, a SQLite price cache, documented endpoints with a single error format, and a dependency-free dashboard with hand-built SVG charts."
summary: "A FastAPI service and dashboard for historical risk measures, with validated inputs, a price cache, and explicit errors for missing data."
limits: "There is no trading calendar, so a date missing for every asset looks like a holiday. Yahoo Finance is unofficial and can rate-limit requests. Annualizing with √252 is an approximation."
flow:
  - "Holdings + dates"
  - "Validate (Pydantic)"
  - "SQLite cache or Yahoo fetch"
  - "Data-quality rules"
  - "Pure analytics → JSON"
decisions:
  - title: "Refuse to fill gaps"
    body: "An interior gap returns MISSING_DATA instead of being dropped or forward-filled. Dropping the date would turn a multi-day move into one “daily” return."
  - title: "Replace, don’t patch, the cache"
    body: "A refresh replaces a symbol’s whole cached history, because adjusted closes change retroactively after splits and dividends."
evidence:
  - "Offline tests use deterministic price fixtures and dependency overrides. One test pins buy-and-hold against daily rebalancing."
  - "JavaScript tests check that the page’s own calculations reproduce the API’s volatility and drawdown dates."
boundary:
  - title: "Precomputed example"
    body: "40% AAPL, 35% MSFT, 25% GOOG, 2023–2025. An illustration, not my own returns."
  - title: "Live result"
    body: "Labelled with fetch and calculation time. Errors never fall back to stale numbers."
headline: "See the risk behind the return."
blurb: "Explores historical performance, drawdowns, volatility, and correlations for a selected stock portfolio."
